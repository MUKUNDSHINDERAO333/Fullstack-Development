<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Media Player Lab</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121214;
            color: #e1e1e6;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #4da6ff;
            margin-bottom: 40px;
            font-size: 2.5rem;
        }
        section {
            background-color: #1d1d22;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        h2 {
            color: #00e676;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        video, audio {
            max-width: 100%;
            border-radius: 4px;
        }
        audio {
            width: 100%;
            max-width: 640px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>Custom Media Hub</h1>

    <section>
        <h2>Now Playing: What is the Map Method?</h2>
        <video controls width="640">
            <source src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </section>

    <section>
        <h2>Track Rotation: Sailing Away</h2>
        <audio controls loop src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3">
            Your browser does not support the audio tag.
        </audio>
    </section>

</body>
</html>
